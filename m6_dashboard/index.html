<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEYAKSH Traffic Dashboard</title>
  <meta name="theme-color" content="#f3f6f8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #203149;
      background: #f4f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --glass: rgba(255, 255, 255, .68);
      --stroke: rgba(111, 137, 173, .2);
      --muted: #687b95;
      --cyan: #438cae;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: #f3f6f8;
    }
    header {
      position: relative;
      overflow: hidden;
      padding: 34px clamp(18px, 5vw, 64px) 30px;
      border-bottom: 1px solid rgba(111, 137, 173, .17);
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .brand { position: relative; z-index: 1; display: flex; align-items: center; gap: 15px; max-width: 1200px; margin: auto; }
    .brand-mark {
      display: grid; place-items: center; flex: 0 0 42px; height: 42px; border-radius: 6px;
      color: #fff; font-weight: 800; letter-spacing: -.04em;
      background: #176b78;
    }
    header h1 { margin: 0 0 5px; font-size: clamp(22px, 3vw, 30px); letter-spacing: -.04em; }
    header p { margin: 0; color: #64758d; font-size: 14px; }
    main { max-width: 1200px; margin: auto; padding: 26px clamp(16px, 4vw, 44px) 56px; }
    .bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 25px; }
    .bar p { margin: 0; color: #536780; font-size: 14px; }
    #summary { display: inline-flex; align-items: center; gap: 9px; }
    #summary::before { width: 8px; height: 8px; content: ""; border-radius: 50%; background: #4ade80; box-shadow: 0 0 13px #4ade8088; }
    button { border: 1px solid #9db5bd; border-radius: 5px; background: #fff; color: #174f5c; padding: 10px 15px; font-weight: 650; cursor: pointer; }
    button:hover { border-color: #176b78; background: #f7fbfc; }
    button:focus-visible, a:focus-visible { outline: 3px solid #3c91a0; outline-offset: 2px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .card, .panel {
      border: 1px solid var(--stroke); border-radius: 16px; padding: 17px;
      background: rgba(255, 255, 255, .74);
      box-shadow: 0 5px 18px rgba(44, 66, 88, .055);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .node { position: relative; overflow: hidden; }
    .node:hover { border-color: #91b6bd; }
    .node h3 { position: relative; z-index: 1; margin: 0 0 8px; color: #243b55; font-size: 16px; }
    .muted { position: relative; z-index: 1; color: var(--muted); font-size: 13px; }
    h2 { display: flex; align-items: center; gap: 10px; margin: 32px 0 13px; font-size: 17px; letter-spacing: -.015em; }
    h2::before { width: 3px; height: 18px; content: ""; border-radius: 1px; background: #247b86; }
    .table-wrap { overflow-x: auto; padding: 4px 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 12px; border-bottom: 1px solid rgba(111, 137, 173, .14); text-align: left; white-space: nowrap; font-size: 13px; }
    th { color: #657892; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    td { color: #2e4058; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(117, 184, 217, .09); }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
    .media-grid .card { padding: 10px; }
    .media-grid .card:hover { border-color: #91b6bd; }
    .media-grid img, .media-grid video { width: 100%; border: 1px solid rgba(111, 137, 173, .18); border-radius: 11px; background: #e7edf5; display: block; object-fit: cover; }
    .media-grid img { aspect-ratio: 4 / 3; object-fit: contain; padding: 8px; }
    .media-grid video { aspect-ratio: 16/9; }
    .media-grid p { margin: 11px 4px 3px; color: #536780; overflow-wrap: anywhere; font-size: 12px; }
    .status { margin: 12px 0; color: #b43e50; }
    a { color: var(--cyan); }
    footer { max-width: 1200px; margin: 0 auto; padding: 18px clamp(16px, 4vw, 44px) 30px; border-top: 1px solid #d6dfe4; color: #61717e; font-size: 13px; }
    footer nav { display: flex; gap: 18px; flex-wrap: wrap; }
    footer a { color: #245f6b; }
    @media (max-width: 560px) { header { padding-top: 25px; padding-bottom: 23px; } .table-wrap { padding: 0 8px; } th, td { padding: 11px 9px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">V</div>
      <div>
        <h1>VEYAKSH Traffic Dashboard</h1>
        <p>Event records, registered camera nodes, and sample media</p>
      </div>
    </div>
  </header>
  <main>
    <div class="bar"><p id="summary">Loading dashboard data…</p><button id="refresh" type="button">Refresh</button></div>
    <p class="status" id="error" role="status"></p>
    <h2>Nodes</h2>
    <section class="grid" id="nodes" aria-live="polite"></section>
    <h2>Recent events</h2>
    <section class="panel table-wrap">
      <table><thead><tr><th>ID</th><th>Time</th><th>Type</th><th>Node</th><th>Class</th><th>Plate</th><th>Clip</th></tr></thead>
      <tbody id="events"></tbody></table>
    </section>
    <h2>Sample pictures and clip</h2>
    <section class="media-grid" id="media"></section>
  </main>
  <footer><nav aria-label="Legal information"><a href="/privacy">Privacy policy draft</a><a href="/terms">Terms and conditions draft</a></nav></footer>
  <script>
    const mediaFiles = [
      {name: "plate_demo_01.jpg", kind: "image"},
      {name: "plate_demo_02.jpg", kind: "image"},
      {name: "plate_demo_03.jpg", kind: "image"},
      {name: "synthetic_demo_clip.mp4", kind: "video"}
    ];
    const cell = (row, value) => { const td = document.createElement("td"); td.textContent = value ?? "Not recorded"; row.append(td); };
    async function loadDashboard() {
      const error = document.querySelector("#error"); error.textContent = "";
      try {
        const [nodesResponse, eventsResponse] = await Promise.all([fetch("/nodes"), fetch("/events?limit=100")]);
        if (!nodesResponse.ok || !eventsResponse.ok) throw new Error("API request failed. Check that the backend is running.");
        const [nodes, events] = await Promise.all([nodesResponse.json(), eventsResponse.json()]);
        const nodesRoot = document.querySelector("#nodes"); nodesRoot.replaceChildren();
        for (const node of nodes) {
          const card = document.createElement("article"); card.className = "card node";
          const title = document.createElement("h3"); title.textContent = `${node.node_id} / ${node.name}`;
          const position = document.createElement("div"); position.className = "muted"; position.textContent = `Lat ${node.lat}, Lon ${node.lon}`;
          card.append(title, position); nodesRoot.append(card);
        }
        const eventRoot = document.querySelector("#events"); eventRoot.replaceChildren();
        for (const event of events) {
          const row = document.createElement("tr");
          cell(row, event.id); cell(row, event.ts); cell(row, event.type); cell(row, event.node_id);
          cell(row, event.class); cell(row, event.plate?.text); cell(row, event.clip); eventRoot.append(row);
        }
        if (events.length === 0) {
          const row = document.createElement("tr"); const empty = document.createElement("td");
          empty.colSpan = 7; empty.textContent = "No events have been recorded."; row.append(empty); eventRoot.append(row);
        }
        document.querySelector("#summary").textContent = `${nodes.length} nodes | ${events.length} recorded events`;
      } catch (err) { error.textContent = err.message; }
    }
    const mediaRoot = document.querySelector("#media");
    for (const file of mediaFiles) {
      const card = document.createElement("article"); card.className = "card";
      const url = `/media/${encodeURIComponent(file.name)}`;
      const preview = file.kind === "video" ? document.createElement("video") : document.createElement("img");
      preview.src = url; preview.alt = file.name;
      if (file.kind === "video") { preview.controls = true; preview.preload = "metadata"; }
      const caption = document.createElement("p"); caption.textContent = file.name;
      card.append(preview, caption); mediaRoot.append(card);
    }
    document.querySelector("#refresh").addEventListener("click", loadDashboard);
    loadDashboard();
  </script>
</body>
</html>
